<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/convex.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/index.css" />

    <!-- Newsreader for document text, Public Sans for chrome, IBM Plex Mono for
         line numbers and stamps. The 09-02 note in index.css deferred the
         typeface to P3 on the grounds that picking one earlier would be
         guessing; P3 is now, so it is not. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap"
    />
    <title>still-true — what your documents actually require of you</title>

    <!-- Link previews. Added 2026-09-05 after the first LinkedIn post proved
         they were missing: with nothing to scrape here, LinkedIn built its card
         from the GitHub link instead, so a post whose whole argument is a
         screenshot of this page showed a repository avatar.

         The URLs are absolute because a scraper resolves them from its own
         origin, not this one, and a relative og:image silently yields no card
         at all — the same failure, one layer down. -->
    <meta
      name="description"
      content="Forward a document. Every answer is quoted from your own text with its line number — it tells you what it never says, and when it changes."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="still-true" />
    <meta property="og:url" content="https://impressive-marten-163.convex.site/" />
    <meta property="og:title" content="still-true — what your documents actually require of you" />
    <meta
      property="og:description"
      content="Forward a document. Every answer is quoted from your own text with its line number — it tells you what it never says, and when it changes."
    />
    <meta property="og:image" content="https://impressive-marten-163.convex.site/og.jpg" />
    <meta property="og:image:width" content="1568" />
    <meta property="og:image:height" content="623" />
    <meta
      property="og:image:alt"
      content="The still-true board: six public documents, 5,124 lines read, every answer carrying the sentence it came from."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="still-true — what your documents actually require of you" />
    <meta
      name="twitter:description"
      content="Forward a document. Every answer is quoted from your own text with its line number — it tells you what it never says, and when it changes."
    />
    <meta name="twitter:image" content="https://impressive-marten-163.convex.site/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
